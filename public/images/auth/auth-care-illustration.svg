  <path d="M207 263c-31-28-112-86-128-137C63 84 91 55 129 55c34 0 60 25 78 54 18-29 44-54 78-54 38 0 66 29 50 71-16 51-97 109-128 137Z" stroke="url(#heartStroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

